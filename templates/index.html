<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_name }} - 고객지원 챗봇</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 로그인 화면 -->
        <div id="login-screen" class="screen active">
            <div class="login-box">
                <h1>{{ chatbot_name }}</h1>
                <p class="subtitle">상담 이력을 기억하는 AI 고객지원</p>
                <div class="login-form">
                    <input type="text" id="username-input" placeholder="이름을 입력하세요" autocomplete="off">
                    <button id="login-btn" onclick="loginUser()">시작하기</button>
                </div>
                <div id="login-error" class="error-message"></div>
            </div>
        </div>

        <!-- 채팅 화면 -->
        <div id="chat-screen" class="screen">
            <div class="chat-container">
                <!-- 헤더 -->
                <div class="chat-header">
                    <div class="header-left">
                        <h2>{{ chatbot_name }}</h2>
                        <span id="user-info" class="user-info"></span>
                    </div>
                    <div class="header-right">
                        <button class="icon-btn" onclick="showExpertStatus()" title="전문가 시스템">
                            🤖
                        </button>
                        <button class="icon-btn" onclick="showHistory()" title="대화 이력">
                            📊
                        </button>
                        <button class="icon-btn" onclick="logout()" title="로그아웃">
                            🚪
                        </button>
                    </div>
                </div>

                <!-- 메시지 영역 -->
                <div id="chat-messages" class="chat-messages">
                    <div class="welcome-message">
                        <p>안녕하세요! 무엇을 도와드릴까요?</p>
                    </div>
                </div>

                <!-- 입력 영역 -->
                <div class="chat-input-container">
                    <div id="file-preview" class="file-preview"></div>
                    <div class="input-wrapper" id="drop-zone">
                        <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.docx,.txt,.xlsx,.csv,.json,.xml" style="display: none;" onchange="handleFileSelect(event)">
                        <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="파일 첨부">
                            📎
                        </button>
                        <textarea
                            id="message-input"
                            placeholder="메시지를 입력하세요..."
                            rows="1"
                            onkeydown="handleKeyPress(event)"
                        ></textarea>
                        <button id="send-btn" onclick="sendMessage()">
                            전송
                        </button>
                    </div>
                    <div id="sentiment-indicator" class="sentiment-indicator"></div>
                </div>
            </div>
        </div>

        <!-- 통계/이력 모달 -->
        <div id="history-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>대화 통계</h3>
                    <button class="close-btn" onclick="closeHistory()">&times;</button>
                </div>
                <div id="history-content" class="modal-body">
                    <!-- 통계 정보가 여기에 표시됩니다 -->
                </div>
            </div>
        </div>

        <!-- 전문가 시스템 모달 -->
        <div id="expert-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>🤖 전문가 시스템 상태</h3>
                    <button class="close-btn" onclick="closeExpertStatus()">&times;</button>
                </div>
                <div id="expert-content" class="modal-body">
                    <!-- 전문가 시스템 정보가 여기에 표시됩니다 -->
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
