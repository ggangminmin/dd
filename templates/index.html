<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_name }} - 고객지원 챗봇</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 로그인/회원가입 화면 -->
        <div id="login-screen" class="screen active">
            <div class="login-box">
                <div class="login-header">
                    <div>
                        <h1>{{ chatbot_name }}</h1>
                        <p class="subtitle">상담 이력을 기억하는 AI 고객지원</p>
                    </div>
                    <button class="theme-toggle-login" onclick="toggleTheme()" id="theme-toggle-login" title="테마 변경">
                        🌙
                    </button>
                </div>

                <!-- 탭 전환 -->
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchAuthTab('login')">로그인</button>
                    <button class="auth-tab" onclick="switchAuthTab('signup')">회원가입</button>
                    <button class="auth-tab" onclick="switchAuthTab('delete')">회원탈퇴</button>
                </div>

                <!-- 로그인 폼 -->
                <div id="login-form" class="auth-form active">
                    <input type="text" id="login-username" placeholder="아이디 또는 이메일" autocomplete="username">
                    <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password" onkeypress="handleLoginKeyPress(event)">
                    <button class="auth-btn" onclick="handleLogin()">로그인</button>
                    <a href="#" class="forgot-password-link" onclick="showForgotPassword(event)">비밀번호를 잊으셨나요?</a>
                    <div class="guest-login">
                        <span>또는</span>
                        <button class="guest-btn" onclick="guestLogin()">게스트로 시작하기</button>
                    </div>
                </div>

                <!-- 회원가입 폼 -->
                <div id="signup-form" class="auth-form">
                    <input type="text" id="signup-username" placeholder="사용자명" autocomplete="username">
                    <input type="email" id="signup-email" placeholder="이메일" autocomplete="email">
                    <input type="password" id="signup-password" placeholder="비밀번호 (최소 6자)" autocomplete="new-password">
                    <input type="password" id="signup-password-confirm" placeholder="비밀번호 확인" autocomplete="new-password" onkeypress="handleSignupKeyPress(event)">
                    <button class="auth-btn" onclick="handleSignup()">회원가입</button>
                </div>

                <!-- 비밀번호 찾기 폼 -->
                <div id="forgot-password-form" class="auth-form">
                    <p style="color: #666; font-size: 14px; margin-bottom: 15px; text-align: center;">
                        가입하신 이메일 주소를 입력하세요.<br>
                        비밀번호 재설정 링크를 보내드립니다.
                    </p>
                    <input type="email" id="forgot-email" placeholder="이메일" autocomplete="email" onkeypress="handleForgotPasswordKeyPress(event)">
                    <button class="auth-btn" onclick="handleForgotPassword()">재설정 링크 받기</button>
                    <button class="guest-btn" onclick="backToLogin()" style="margin-top: 10px;">로그인으로 돌아가기</button>
                </div>

                <!-- 회원탈퇴 폼 -->
                <div id="delete-account-form" class="auth-form">
                    <p style="color: #dc2626; font-size: 14px; margin-bottom: 15px; text-align: center; font-weight: 600;">
                        ⚠️ 계정 삭제 시 모든 데이터가 영구 삭제됩니다.<br>
                        계정을 삭제하시려면 아이디와 비밀번호를 입력하세요.
                    </p>
                    <input type="text" id="delete-username" placeholder="아이디 또는 이메일" autocomplete="username">
                    <input type="password" id="delete-password" placeholder="비밀번호" autocomplete="current-password" onkeypress="handleDeleteAccountKeyPress(event)">
                    <div style="margin: 15px 0;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="delete-confirm-checkbox" style="width: 18px; height: 18px;">
                            <span style="color: #666; font-size: 14px;">모든 데이터가 삭제됨을 이해했습니다</span>
                        </label>
                    </div>
                    <button class="delete-btn" onclick="handleDeleteAccount()">계정 삭제</button>
                    <button class="guest-btn" onclick="backToLogin()" style="margin-top: 10px;">로그인으로 돌아가기</button>
                </div>

                <div id="auth-error" class="error-message"></div>
                <div id="auth-success" class="success-message"></div>
            </div>
        </div>

        <!-- 채팅 화면 -->
        <div id="chat-screen" class="screen">
            <div class="chat-container">
                <!-- 헤더 -->
                <div class="chat-header">
                    <div class="header-left">
                        <h2>{{ chatbot_name }}</h2>
                        <span id="user-info" class="user-info"></span>
                    </div>
                    <div class="header-right">
                        <button class="icon-btn" onclick="toggleTheme()" title="테마 변경" id="theme-toggle">
                            🌙
                        </button>
                        <button class="icon-btn" onclick="showSearchModal()" title="대화 검색">
                            🔍
                        </button>
                        <button class="icon-btn" onclick="showHistory()" title="대화 통계">
                            📊
                        </button>
                        <button class="icon-btn" onclick="deleteHistory()" title="대화 삭제">
                            🗑️
                        </button>
                        <button class="icon-btn" onclick="logout()" title="로그아웃">
                            🚪
                        </button>
                    </div>
                </div>

                <!-- 메시지 영역 -->
                <div id="chat-messages" class="chat-messages">
                    <div class="welcome-message">
                        <p>안녕하세요! 무엇을 도와드릴까요?</p>
                    </div>
                </div>

                <!-- 입력 영역 -->
                <div class="chat-input-container">
                    <div id="file-preview" class="file-preview"></div>
                    <div class="input-wrapper" id="drop-zone">
                        <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.docx,.txt,.xlsx,.csv,.json,.xml" style="display: none;" onchange="handleFileSelect(event)">
                        <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="파일 첨부">
                            📎
                        </button>
                        <textarea
                            id="message-input"
                            placeholder="메시지를 입력하세요..."
                            rows="1"
                            onkeydown="handleKeyPress(event)"
                        ></textarea>
                        <button id="send-btn" onclick="sendMessage()">
                            전송
                        </button>
                    </div>
                    <div id="sentiment-indicator" class="sentiment-indicator"></div>
                </div>
            </div>
        </div>

        <!-- 검색 모달 -->
        <div id="search-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>대화 내용 검색</h3>
                    <button class="close-btn" onclick="closeSearchModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="검색어를 입력하세요..." onkeypress="handleSearchKeyPress(event)">
                        <button class="search-btn" onclick="performSearch()">🔍 검색</button>
                    </div>
                    <div id="search-results" class="search-results">
                        <!-- 검색 결과가 여기에 표시됩니다 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 통계/이력 모달 -->
        <div id="history-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>대화 통계</h3>
                    <button class="close-btn" onclick="closeHistory()">&times;</button>
                </div>
                <div id="history-content" class="modal-body">
                    <!-- 통계 정보가 여기에 표시됩니다 -->
                </div>
            </div>
        </div>

    </div>

    <!-- 이미지 뷰어 모달 -->
    <div id="image-viewer-modal" class="modal image-viewer-modal">
        <span class="image-viewer-close" onclick="closeImageViewer()">&times;</span>
        <img class="image-viewer-content" id="image-viewer-img">
    </div>

    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
