<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .reset-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .reset-container h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }
        .reset-container p {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .reset-form input {
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: border-color 0.3s;
        }
        .reset-form input:focus {
            outline: none;
            border-color: #667eea;
        }
        .reset-btn {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .reset-btn:hover {
            transform: translateY(-2px);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .password-requirements {
            font-size: 12px;
            color: #999;
            margin-top: -10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reset-container">
            <h1>비밀번호 재설정</h1>
            <p id="reset-description">새로운 비밀번호를 입력하세요.</p>

            <div id="reset-form-container">
                <form class="reset-form" onsubmit="handleResetPassword(event)">
                    <input type="password" id="new-password" placeholder="새 비밀번호 (최소 6자)" autocomplete="new-password" required>
                    <p class="password-requirements">비밀번호는 최소 6자 이상이어야 합니다.</p>
                    <input type="password" id="confirm-password" placeholder="비밀번호 확인" autocomplete="new-password" required>
                    <button type="submit" class="reset-btn">비밀번호 변경</button>
                </form>
            </div>

            <div id="reset-error" class="error-message"></div>
            <div id="reset-success" class="success-message"></div>

            <a href="/" class="back-link">로그인 페이지로 돌아가기</a>
        </div>
    </div>

    <script>
        // URL에서 토큰 추출
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // 페이지 로드 시 토큰 검증
        window.addEventListener('DOMContentLoaded', async () => {
            if (!token) {
                document.getElementById('reset-description').textContent = '유효하지 않은 링크입니다.';
                document.getElementById('reset-form-container').style.display = 'none';
                document.getElementById('reset-error').textContent = '비밀번호 재설정 링크가 유효하지 않습니다.';
                return;
            }

            // 토큰 검증
            try {
                const response = await fetch('/api/verify-reset-token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (!data.success) {
                    document.getElementById('reset-description').textContent = '링크가 만료되었거나 유효하지 않습니다.';
                    document.getElementById('reset-form-container').style.display = 'none';
                    document.getElementById('reset-error').textContent = data.error || '토큰이 유효하지 않습니다.';
                } else {
                    document.getElementById('reset-description').textContent = `${data.username}님, 새로운 비밀번호를 입력하세요.`;
                }
            } catch (error) {
                console.error('토큰 검증 오류:', error);
                document.getElementById('reset-description').textContent = '오류가 발생했습니다.';
                document.getElementById('reset-form-container').style.display = 'none';
                document.getElementById('reset-error').textContent = '서버와의 통신에 실패했습니다.';
            }
        });

        // 비밀번호 재설정 처리
        async function handleResetPassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorMsg = document.getElementById('reset-error');
            const successMsg = document.getElementById('reset-success');

            errorMsg.textContent = '';
            successMsg.textContent = '';

            // 비밀번호 확인
            if (newPassword !== confirmPassword) {
                errorMsg.textContent = '비밀번호가 일치하지 않습니다.';
                return;
            }

            // 비밀번호 길이 검증
            if (newPassword.length < 6) {
                errorMsg.textContent = '비밀번호는 최소 6자 이상이어야 합니다.';
                return;
            }

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        password: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = data.message + ' 로그인 페이지로 이동합니다...';
                    document.getElementById('reset-form-container').style.display = 'none';

                    // 3초 후 로그인 페이지로 이동
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                } else {
                    errorMsg.textContent = data.error || '비밀번호 변경에 실패했습니다.';
                }
            } catch (error) {
                console.error('비밀번호 재설정 오류:', error);
                errorMsg.textContent = '서버와의 통신에 실패했습니다.';
            }
        }
    </script>
</body>
</html>
